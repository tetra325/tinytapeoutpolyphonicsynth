# Tiny Tapeout project information
project:
  title:        "6-Voice Polyphonic Multiplier-Free Synth"
  author:       "Marcus Chan"
  discord:      ""
  description:  "6-voice polyphonic shift-and-add subtractive synthesizer with MIDI RX, SVF filter, and I2S output"
  language:     "Verilog"
  clock_hz:     12000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "2x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_poly6_synth"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_poly6_synth.v"
    - "synth_top.v"
    - "midi_rx.v"
    - "poly_note_ctrl.v"
    - "vco.v"
    - "adsr_vca.v"
    - "vcf_svf.v"
    - "i2s_tx.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "wave_sel[0]"
  ui[1]: "wave_sel[1]"
  ui[2]: "cutoff_shift[0]"
  ui[3]: "cutoff_shift[1]"
  ui[4]: "cutoff_shift[2]"
  ui[5]: "res_shift[0]"
  ui[6]: "res_shift[1]"
  ui[7]: "res_shift[2]"

  # Outputs
  uo[0]: "i2s_sdata"
  uo[1]: "i2s_bclk"
  uo[2]: "i2s_lrck"
  uo[3]: "any_gate"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "midi_rx_in"
  uio[1]: "atk_shift[0]"
  uio[2]: "atk_shift[1]"
  uio[3]: "atk_shift[2]"
  uio[4]: "dec_shift[0]"
  uio[5]: "dec_shift[1]"
  uio[6]: "dec_shift[2]"
  uio[7]: ""

# Do not change!
yaml_version: 6
